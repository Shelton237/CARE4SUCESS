server {
    listen 80;
    server_name care4success.usra-care.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name care4success.usra-care.com;

    ssl_certificate     /etc/letsencrypt/live/care4success.usra-care.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/care4success.usra-care.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/CARE4SUCESS/dist;
    index index.html;

    client_max_body_size 50M;
    proxy_read_timeout 120s;
    proxy_connect_timeout 120s;

    # API reverse proxy
    location /api {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Uploads statiques
    location /uploads {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_log  /var/log/nginx/care4success_error.log;
    access_log /var/log/nginx/care4success_access.log;
}
