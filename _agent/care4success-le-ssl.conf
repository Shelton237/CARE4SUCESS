<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName care4success.usra-care.com
    DocumentRoot /var/www/CARE4SUCESS/dist

    # Fix 408 timeout sur upload CV (candidature enseignant) : le defaut Apache
    # (body=10,minrate=500) est trop strict pour un upload sur reseau mobile lent.
    RequestReadTimeout header=20-40,MinRate=500 body=60,MinRate=300
    ProxyTimeout 120

    <Directory /var/www/CARE4SUCESS/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride FileInfo
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /uploads http://127.0.0.1:4002/uploads
    ProxyPassReverse /uploads http://127.0.0.1:4002/uploads
    ProxyPass /api http://127.0.0.1:4002/api
    ProxyPassReverse /api http://127.0.0.1:4002/api

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api
    RewriteCond %{REQUEST_URI} !^/uploads
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteRule ^ /index.html [L]

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/care4success.usra-care.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/care4success.usra-care.com/privkey.pem
    ErrorLog /var/log/apache2/care4success_error.log
    CustomLog /var/log/apache2/care4success_access.log combined
</VirtualHost>
</IfModule>
