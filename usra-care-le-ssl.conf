<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName usra-care.com
    ServerAlias www.usra-care.com
    DocumentRoot /var/www/USRA-CARE/public

    <Directory /var/www/USRA-CARE/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/usra-care_error.log
    CustomLog ${APACHE_LOG_DIR}/usra-care_access.log combined

    SSLCertificateFile /etc/letsencrypt/live/usra-care.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/usra-care.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
